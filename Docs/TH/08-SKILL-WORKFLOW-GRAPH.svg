<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 44px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 22px; fill: #475569; }
      .lane-title { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
      .node-title { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
      .node-body { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 18px; fill: #334155; }
      .small { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 15px; fill: #475569; }
      .badge { font-family: Sarabun, Tahoma, Arial, sans-serif; font-size: 16px; font-weight: 800; }
      .line { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 8 8; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .work { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .review { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .gate { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
      .block { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
      .neutral { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>

  <text class="title" x="70" y="76">DIGITAL_EVIDENCE: Skill Workflow Graph</text>
  <text class="subtitle" x="70" y="116">ภาพรวมลำดับการทำงานและจังหวะเรียกใช้สกิลแบบมองเห็นทันที จากหลักฐานไฟล์จริงในโปรเจกต์</text>

  <rect class="lane" x="60" y="150" width="410" height="825" rx="22" filter="url(#shadow)"/>
  <rect class="lane" x="500" y="150" width="560" height="825" rx="22" filter="url(#shadow)"/>
  <rect class="lane" x="1090" y="150" width="650" height="825" rx="22" filter="url(#shadow)"/>
  <rect class="lane" x="60" y="1010" width="1680" height="190" rx="22" filter="url(#shadow)"/>

  <text class="lane-title" x="90" y="195">1. เปิดงานและจำบริบท</text>
  <text class="lane-title" x="530" y="195">2. งานสร้างระบบ: SDLC 8 ขั้น</text>
  <text class="lane-title" x="1120" y="195">3. งานหลักฐาน: เลือก Pipeline จริง</text>
  <text class="lane-title" x="90" y="1055">4. Gate / Blocker / สิ่งที่ต้องแก้ก่อนระบบคุมสกิลครบ 100%</text>

  <!-- Left lane -->
  <rect class="work" x="100" y="240" width="330" height="92" rx="18"/>
  <text class="node-title" x="125" y="276">รับคำสั่งผู้ใช้</text>
  <text class="node-body" x="125" y="305">เริ่มจาก scope จริง ไม่เดา path/API</text>

  <rect class="block" x="100" y="380" width="330" height="112" rx="18"/>
  <text class="node-title" x="125" y="418">Understand Gate</text>
  <text class="node-body" x="125" y="448">ควรรัน: py tools/understand.py scan</text>
  <text class="node-body" x="125" y="475">สถานะ: py.exe ถูกปฏิเสธการเข้าถึง</text>

  <rect class="ok" x="100" y="540" width="330" height="112" rx="18"/>
  <text class="node-title" x="125" y="578">Memory Load</text>
  <text class="node-body" x="125" y="608">อ่าน behavior.json + mistakes.md</text>
  <text class="node-body" x="125" y="635">ใช้กฎห้ามเดา/ห้ามทำซ้ำ</text>

  <rect class="work" x="100" y="700" width="330" height="122" rx="18"/>
  <text class="node-title" x="125" y="738">Classify Intent</text>
  <text class="node-body" x="125" y="768">สร้างระบบ / หลักฐาน / Dashboard</text>
  <text class="node-body" x="125" y="795">เลือกเส้นทางก่อนลงมือ</text>

  <path class="line" d="M265 332 L265 380"/>
  <path class="line" d="M265 492 L265 540"/>
  <path class="line" d="M265 652 L265 700"/>

  <!-- Center lane SDLC -->
  <rect class="work" x="540" y="240" width="210" height="82" rx="18"/>
  <text class="node-title" x="565" y="275">0 Idea</text>
  <text class="node-body" x="565" y="303">ตั้งโจทย์</text>

  <rect class="work" x="810" y="240" width="210" height="82" rx="18"/>
  <text class="node-title" x="835" y="275">1 Specify</text>
  <text class="node-body" x="835" y="303">Requirement</text>

  <rect class="work" x="540" y="370" width="210" height="82" rx="18"/>
  <text class="node-title" x="565" y="405">2 Plan</text>
  <text class="node-body" x="565" y="433">แผน atomic</text>

  <rect class="work" x="810" y="370" width="210" height="82" rx="18"/>
  <text class="node-title" x="835" y="405">3 Tasks</text>
  <text class="node-body" x="835" y="433">งานย่อยวัดผล</text>

  <rect class="work" x="540" y="500" width="210" height="82" rx="18"/>
  <text class="node-title" x="565" y="535">4 Implement</text>
  <text class="node-body" x="565" y="563">ทำจริง</text>

  <rect class="review" x="810" y="500" width="210" height="82" rx="18"/>
  <text class="node-title" x="835" y="535">5 Review</text>
  <text class="node-body" x="835" y="563">Test + Review</text>

  <rect class="work" x="540" y="630" width="210" height="82" rx="18"/>
  <text class="node-title" x="565" y="665">6 Deploy</text>
  <text class="node-body" x="565" y="693">ถ้าต้องเผยแพร่</text>

  <rect class="work" x="810" y="630" width="210" height="82" rx="18"/>
  <text class="node-title" x="835" y="665">7 Operate</text>
  <text class="node-body" x="835" y="693">ดูแล/รันต่อ</text>

  <rect class="gate" x="590" y="770" width="380" height="120" rx="18"/>
  <text class="node-title" x="620" y="810">Boosters</text>
  <text class="node-body" x="620" y="840">constitution → clarify → checklist</text>
  <text class="node-body" x="620" y="868">analyze → converge</text>

  <path class="line" d="M750 281 L810 281"/>
  <path class="line" d="M915 322 L915 370"/>
  <path class="line" d="M810 411 L750 411"/>
  <path class="line" d="M645 452 L645 500"/>
  <path class="line" d="M750 541 L810 541"/>
  <path class="line" d="M915 582 L915 630"/>
  <path class="line" d="M810 671 L750 671"/>
  <path class="line" d="M645 712 L645 770"/>

  <rect class="block" x="540" y="905" width="480" height="45" rx="16"/>
  <text class="badge" x="565" y="934" fill="#991b1b">BLOCKER: ยังไม่พบ sdlc-skills.yaml จึงตรวจ mapping phase → skill ไม่ได้</text>

  <!-- Right lane pipelines -->
  <rect class="work" x="1130" y="240" width="560" height="135" rx="18"/>
  <text class="node-title" x="1160" y="278">Flow A: Slip</text>
  <text class="node-body" x="1160" y="310">Watcher → Preprocess → QR → OCR → Vision</text>
  <text class="node-body" x="1160" y="338">Normalize → Dedup → Excel/JSON → Gate</text>

  <rect class="work" x="1130" y="425" width="560" height="135" rx="18"/>
  <text class="node-title" x="1160" y="463">Flow B: Chat</text>
  <text class="node-body" x="1160" y="495">List_names → Dicut_Chat → QuietZone → Dedup</text>
  <text class="node-body" x="1160" y="523">PDF → Search_Slip → Index → Hash Cert → Gate</text>

  <rect class="work" x="1130" y="610" width="560" height="120" rx="18"/>
  <text class="node-title" x="1160" y="648">Flow C: Dashboard</text>
  <text class="node-body" x="1160" y="680">อ่าน Folder_Out/*.json → แสดงผล → ค้นหา</text>
  <text class="node-body" x="1160" y="708">คลิกเลขหน้า → เปิด PDF แบบ read-only</text>

  <rect class="review" x="1130" y="790" width="250" height="95" rx="18"/>
  <text class="node-title" x="1160" y="827">Code Review</text>
  <text class="node-body" x="1160" y="856">เร็ว ทุก loop สำคัญ</text>

  <rect class="review" x="1440" y="790" width="250" height="95" rx="18"/>
  <text class="node-title" x="1460" y="827">Quality Review</text>
  <text class="node-body" x="1460" y="856">ก่อน production เท่านั้น</text>

  <path class="line" d="M1410 375 L1410 425"/>
  <path class="line" d="M1410 560 L1410 610"/>
  <path class="line" d="M1410 730 L1280 790"/>
  <path class="line" d="M1380 837 L1440 837"/>

  <!-- Cross connections -->
  <path class="line-soft" d="M430 760 C500 760, 470 280, 540 280"/>
  <path class="line-soft" d="M430 760 C750 740, 870 300, 1130 300"/>
  <path class="line-soft" d="M1020 540 C1070 540, 1075 837, 1130 837"/>

  <!-- Bottom gate lane -->
  <rect class="gate" x="100" y="1090" width="310" height="78" rx="18"/>
  <text class="node-title" x="125" y="1123">Pre-Delivery Gate</text>
  <text class="node-body" x="125" y="1152">ตรวจ 10 มิติ ก่อนส่งมอบ</text>

  <rect class="ok" x="470" y="1090" width="265" height="78" rx="18"/>
  <text class="node-title" x="495" y="1123">ALL GREEN</text>
  <text class="node-body" x="495" y="1152">รอบล่าสุดผ่าน 10/10</text>

  <rect class="block" x="795" y="1090" width="310" height="78" rx="18"/>
  <text class="node-title" x="820" y="1123">Save Hook Missing</text>
  <text class="node-body" x="820" y="1152">ไม่พบ tools/save-state.py</text>

  <rect class="block" x="1165" y="1090" width="260" height="78" rx="18"/>
  <text class="node-title" x="1190" y="1123">py.exe Blocked</text>
  <text class="node-body" x="1190" y="1152">ใช้ python.exe แทนได้</text>

  <rect class="neutral" x="1485" y="1090" width="210" height="78" rx="18"/>
  <text class="node-title" x="1510" y="1123">ส่งมอบ</text>
  <text class="node-body" x="1510" y="1152">พร้อมหลักฐาน path</text>

  <path class="line" d="M410 1129 L470 1129"/>
  <path class="line" d="M735 1129 L795 1129"/>
  <path class="line-soft" d="M1105 1129 L1165 1129"/>
  <path class="line" d="M1425 1129 L1485 1129"/>

  <!-- Legend -->
  <rect class="neutral" x="1260" y="44" width="470" height="88" rx="18"/>
  <rect class="ok" x="1285" y="65" width="28" height="22" rx="5"/>
  <text class="small" x="1323" y="82">ผ่าน/ถูกเวลา</text>
  <rect class="work" x="1435" y="65" width="28" height="22" rx="5"/>
  <text class="small" x="1473" y="82">งานหลัก</text>
  <rect class="review" x="1580" y="65" width="28" height="22" rx="5"/>
  <text class="small" x="1618" y="82">รีวิว</text>
  <rect class="block" x="1285" y="98" width="28" height="22" rx="5"/>
  <text class="small" x="1323" y="115">ต้องแก้/ยังรันไม่ได้</text>
  <rect class="gate" x="1508" y="98" width="28" height="22" rx="5"/>
  <text class="small" x="1546" y="115">ด่านตรวจ</text>
</svg>
